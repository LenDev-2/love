    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .wrapper {

    flex-direction: column;
    align-items: center;
    text-align: center; 
    width: 100%;
    max-width: 400px;
    padding: 15px;
  }

  .logo {

  }

    font-size: 28px; 
    margin-bottom: 15px; 
  }

  .container { 
    background: rgba(255,255,255,0.75); 
    padding: 20px; 
    border-radius: 15px; 
    width: 100%; 
    box-shadow: 0 0 20px rgba(255,0,100,0.3); 
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  input, textarea { 
    width: 90%; 
    padding: 10px; 
    margin-top: 10px; 
    border-radius: 8px; 
    border: 2px solid #ff74a4; 
    outline: none; 
    font-size: 16px; 
    text-align: center; 
    background: #ffe3ef; 
  }

  button { 
    margin-top: 12px; 
    padding: 10px 15px; 
    width: 95%; 
    max-width: 250px;
    background: #ff2d7d; 
    border: none; 
    color: white; 
    font-size: 16px; 
    border-radius: 8px; 
    cursor: pointer; 
    box-shadow: 0 0 10px rgba(255,0,120,0.5); 
    transition: transform 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  #hasil { 
    margin-top: 15px; 
    font-size: 18px; 
    color: #d60062; 
    opacity: 0; 
    transform: translateY(10px); 
    transition: 0.5s; 
    word-wrap: break-word;
  }

  .show { 
    opacity: 1 !important; 
    transform: translateY(0) !important; 
  }

  .author {
    margin-top: 15px;
    font-size: 14px;
    color: #ff2d7d;
    text-align: center;
    text-shadow: 0 0 4px white;
  }

  @media(max-width: 350px){
    h1 { font-size: 24px; }
    input, textarea { font-size: 14px; }
    button { font-size: 14px; padding: 8px; }

  function tampil() {
    let nm = document.getElementById("nama").value.trim();
    if (nm === "") nm = "kamu";

    const random = kata[Math.floor(Math.random() * kata.length)];
    const hasil = random.replace(/{nama}/g, nm);

    const box = document.getElementById("hasil");
    box.innerHTML = hasil;
    box.classList.remove("show");
    setTimeout(() => box.classList.add("show"), 10);
  }

  function tambahKata() {
    const teks = document.getElementById("kataBaru").value.trim();
    const notif = document.getElementById("notif");

    if (teks === "") {
      notif.innerHTML = "❗ Teks masih kosong!";
      return;
    }

    const lower = teks.toLowerCase();
    for (let kataKasar of filterKasar) {
      if (lower.includes(kataKasar)) {
        notif.innerHTML = "❗ Kata tidak boleh mengandung kata kasar!";
        return;
      }
    }

    kata.push(teks);
    notif.innerHTML = "✔ Kata bucin baru berhasil ditambahkan!";
    document.getElementById("kataBaru").value = "";
  }
