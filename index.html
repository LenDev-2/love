<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Web Bucin Pink</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(#ffebf3, #ffc4dd);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .wrapper { 
    text-align: center; 
    z-index: 10; 
  }

  /* LOGO – Glow Pink */
  .logo {
    width: 150px;
    height: auto;
    margin-bottom: 20px;
    object-fit: contain;
    border-radius: 10px;
    filter: drop-shadow(0 0 20px #ff4fa3); /* glow pink */
  }

  h1 { 
    color: #ff2d7d; 
    text-shadow: 0 0 6px white; 
    font-size: 32px; 
    margin-bottom: 15px; 
  }

  .container { 
    background: rgba(255,255,255,0.65); 
    padding: 22px; 
    border-radius: 15px; 
    width: 300px; 
    margin: auto; 
    box-shadow: 0 0 20px rgba(255,0,100,0.3); 
  }

  input { 
    width: 90%; 
    padding: 10px; 
    margin-top: 10px; 
    border-radius: 8px; 
    border: 2px solid #ff74a4; 
    outline: none; 
    font-size: 16px; 
    text-align: center; 
    background: #ffe3ef; 
  }

  button { 
    margin-top: 12px; 
    padding: 10px 15px; 
    width: 100%; 
    background: #ff2d7d; 
    border: none; 
    color: white; 
    font-size: 18px; 
    border-radius: 8px; 
    cursor: pointer; 
    box-shadow: 0 0 10px rgba(255,0,120,0.5); 
  }

  #hasil { 
    margin-top: 18px; 
    font-size: 20px; 
    color: #d60062; 
    opacity: 0; 
    transform: translateY(15px); 
    transition: 0.5s; 
  }

  .show { 
    opacity: 1 !important; 
    transform: translateY(0) !important; 
  }
</style>

</head>
<body>

<div class="wrapper">

  <!-- Logo kamu -->
  <img src="logo.png" alt="Logo" class="logo">

  <h1>💗 Web Bucin Pink</h1>

  <div class="container">
    <label>Masukkan Nama Ayang:</label>
    <input type="text" id="nama" placeholder="Nama dia...">
    <button onclick="tampil()">Tampilkan Kata Bucin</button>
    <div id="hasil"></div>
  </div>
</div>

<script>
  const kata = [
    "{nama}, kamu itu manis banget sampe gula kalah.",
    "Kalau ada ranking orang tercantik/terganteng, kamu juaranya {nama}.",
    "Setiap hari aku suka sama kamu, tapi hari ini lebih lagi {nama}.",
    "Sehebat apapun hari ini… tetap kamu yang paling bikin aku bahagia, {nama}.",
    "{nama}, boleh gak aku sayang kamu terus?"
  ];

  function tampil() {
    let nm = document.getElementById("nama").value.trim();
    if (nm === "") nm = "kamu";

    const random = kata[Math.floor(Math.random() * kata.length)];
    const hasil = random.replace(/{nama}/g, nm);

    const box = document.getElementById("hasil");
    box.innerHTML = hasil;

    box.classList.remove("show");
    setTimeout(() => box.classList.add("show"), 10);
  }
</script>

</body>
</html>
